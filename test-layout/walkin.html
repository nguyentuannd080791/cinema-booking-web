<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineMax - Bán Vé Tại Quầy (Walk-In)</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="role-simulator.js"></script>
    <style>
      body {
        background-color: #0f0f0f;
        overflow: hidden;
      }
      .navbar-walkin {
        background-color: #1a1a1a !important;
        border-bottom: 2px solid #2ECC71; /* Green POS accent line */
        height: 70px;
      }
      .pos-wrapper {
        height: calc(100vh - 70px);
      }
      .pos-seating-area {
        height: 100%;
        overflow-y: auto;
        padding: 2rem;
      }
      .pos-sidebar {
        background-color: #161616;
        border-left: 2px solid #222;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 2rem;
      }
      /* POS overrides for selecting seats (using accent red colors) */
      .seat-btn.selected-walkin {
        background-color: var(--accent-color) !important;
        border-color: var(--accent-color) !important;
        color: white !important;
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <!-- Walk-in Header Navbar -->
    <nav class="navbar-cinemax" style="border-bottom: 2px solid var(--success) !important;">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <a class="nav-brand me-4" href="home.html">
            <i class="bi bi-cpu-fill text-success"></i>CINE<span>MAX</span> <small class="text-success-c fs-6 font-title ms-2">POS</small>
          </a>
          <span class="badge bg-success text-white font-title px-3 py-1 ms-2" style="font-size: 12px;">WALK-IN MODE</span>
        </div>
        <div class="nav-actions">
          <a href="home.html" class="btn-nav-ghost"><i class="bi bi-box-arrow-left me-1"></i>Thoát</a>
        </div>
      </div>
    </nav>

    <!-- Main POS Layout -->
    <div class="container-fluid px-0">
      <div class="row g-0 pos-wrapper">
        
        <!-- Left: Seating Area (70%) -->
        <div class="col-md-8 pos-seating-area">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="font-title mb-0 border-start border-success border-4 ps-3 text-white">Sơ đồ chọn ghế</h4>
            <span class="text-muted-custom">Chọn trực tiếp ghế trống cho khách vãng lai</span>
          </div>

          <!-- Screen visual -->
          <div class="screen-container text-center mb-5">
            <div class="screen-visual" style="background: rgba(46, 204, 113, 0.1);">MÀN HÌNH CHÍNH</div>
          </div>

          <!-- Seating matrix -->
          <div class="overflow-auto pb-4">
            <div class="seating-matrix" style="min-width: 600px;">
              <!-- Row A -->
              <div class="seat-row">
                <span class="seat-label">A</span>
                <button class="seat-btn" onclick="selectWalkin(this, 'A1', false)">1</button>
                <button class="seat-btn" onclick="selectWalkin(this, 'A2', false)">2</button>
                <button class="seat-btn sold">3</button>
                <button class="seat-btn sold">4</button>
                <span class="mx-3"></span>
                <button class="seat-btn" onclick="selectWalkin(this, 'A5', false)">5</button>
                <button class="seat-btn" onclick="selectWalkin(this, 'A6', false)">6</button>
                <button class="seat-btn" onclick="selectWalkin(this, 'A7', false)">7</button>
                <button class="seat-btn" onclick="selectWalkin(this, 'A8', false)">8</button>
                <span class="seat-label">A</span>
              </div>

              <!-- Row B -->
              <div class="seat-row">
                <span class="seat-label">B</span>
                <button class="seat-btn" onclick="selectWalkin(this, 'B1', false)">1</button>
                <button class="seat-btn" onclick="selectWalkin(this, 'B2', false)">2</button>
                <button class="seat-btn" onclick="selectWalkin(this, 'B3', false)">3</button>
                <button class="seat-btn" onclick="selectWalkin(this, 'B4', false)">4</button>
                <span class="mx-3"></span>
                <button class="seat-btn" onclick="selectWalkin(this, 'B5', false)">5</button>
                <button class="seat-btn sold">6</button>
                <button class="seat-btn sold">7</button>
                <button class="seat-btn" onclick="selectWalkin(this, 'B8', false)">8</button>
                <span class="seat-label">B</span>
              </div>

              <!-- Row C (VIP Area) -->
              <div class="seat-row">
                <span class="seat-label">C</span>
                <button class="seat-btn border-warning text-warning" onclick="selectWalkin(this, 'C1', true)">1</button>
                <button class="seat-btn border-warning text-warning" onclick="selectWalkin(this, 'C2', true)">2</button>
                <button class="seat-btn border-warning text-warning" onclick="selectWalkin(this, 'C3', true)">3</button>
                <button class="seat-btn border-warning text-warning" onclick="selectWalkin(this, 'C4', true)">4</button>
                <span class="mx-3"></span>
                <button class="seat-btn border-warning text-warning" onclick="selectWalkin(this, 'C5', true)">5</button>
                <button class="seat-btn border-warning text-warning" onclick="selectWalkin(this, 'C6', true)">6</button>
                <button class="seat-btn border-warning text-warning" onclick="selectWalkin(this, 'C7', true)">7</button>
                <button class="seat-btn border-warning text-warning" onclick="selectWalkin(this, 'C8', true)">8</button>
                <span class="seat-label">C</span>
              </div>

              <!-- Row D (Couple Seats) -->
              <div class="seat-row">
                <span class="seat-label">D</span>
                <button class="seat-btn couple" onclick="selectWalkin(this, 'D1', false, true)">1</button>
                <button class="seat-btn couple" onclick="selectWalkin(this, 'D2', false, true)">2</button>
                <span class="mx-3"></span>
                <button class="seat-btn couple" onclick="selectWalkin(this, 'D3', false, true)">3</button>
                <button class="seat-btn couple" onclick="selectWalkin(this, 'D4', false, true)">4</button>
                <span class="seat-label">D</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Right: Checkout side bar POS (30%) -->
        <div class="col-md-4 pos-sidebar">
          <div>
            <h4 class="font-title border-start border-success border-4 ps-3 text-success mb-4">Chi Tiết Đơn Hàng</h4>
            
            <div class="mb-3">
              <label class="text-white-50 fs-6">Phim:</label>
              <h5 class="text-white font-title mb-0">Avatar: Dòng Chảy Của Nước</h5>
            </div>
            
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="text-white-50">Phòng:</label>
                <span class="text-white font-title d-block">Hall 1</span>
              </div>
              <div class="col-6">
                <label class="text-white-50">Lịch Chiếu:</label>
                <span class="text-white font-title d-block">19:00</span>
              </div>
            </div>

            <hr class="border-secondary my-3" />

            <div class="mb-4">
              <label class="text-white-50 mb-2">Ghế đang chọn (real-time):</label>
              <div id="selected-list" class="bg-dark p-3 rounded" style="min-height: 80px; max-height: 200px; overflow-y: auto;">
                <p class="text-muted-custom mb-0 italic">Click vào ghế để thêm vào giỏ</p>
              </div>
            </div>
          </div>

          <div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="text-white-50 font-title fs-5">TỔNG TIỀN:</span>
              <span class="text-success font-title h2 mb-0" id="pos-total">0 đ</span>
            </div>

            <div class="d-grid gap-2">
              <button onclick="checkoutWalkin()" class="btn btn-success btn-lg py-3 font-title text-white text-uppercase" id="checkout-btn" disabled style="background-color: #2ECC71 !important; border-color: #2ECC71 !important;">
                <i class="bi bi-printer-fill me-2"></i>Tạo Vé Vãng Lai <span class="badge bg-dark ms-1">Enter</span>
              </button>
              <a href="movie-detail.html" class="btn btn-outline-secondary py-2 text-white-50">Hủy bỏ</a>
            </div>
          </div>

        </div>

      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let walkinSeats = [];
      const normalPrice = 80000;
      const vipPrice = 120000;
      const couplePrice = 180000;

      function selectWalkin(btn, seatName, isVip, isCouple) {
        btn.classList.toggle('selected-walkin');

        if (btn.classList.contains('selected-walkin')) {
          walkinSeats.push({ name: seatName, vip: isVip, couple: isCouple });
        } else {
          walkinSeats = walkinSeats.filter(seat => seat.name !== seatName);
        }

        updatePOS();
      }

      function updatePOS() {
        const listDiv = document.getElementById('selected-list');
        const totalSpan = document.getElementById('pos-total');
        const checkoutBtn = document.getElementById('checkout-btn');

        if (walkinSeats.length === 0) {
          listDiv.innerHTML = '<p class="text-muted-custom mb-0 italic">Click vào ghế để thêm vào giỏ</p>';
          totalSpan.textContent = "0 đ";
          checkoutBtn.disabled = true;
        } else {
          let listHtml = '<table class="table table-dark table-borderless table-sm mb-0"><tbody>';
          let sum = 0;
          walkinSeats.forEach(seat => {
            const price = seat.couple ? couplePrice : seat.vip ? vipPrice : normalPrice;
            sum += price;
            listHtml += `<tr><td>Ghế ${seat.name} ${seat.couple ? '(Couple)' : seat.vip ? '(VIP)' : ''}</td><td class="text-end text-success">${price.toLocaleString('vi-VN')} đ</td></tr>`;
          });
          listHtml += '</tbody></table>';
          listDiv.innerHTML = listHtml;
          totalSpan.textContent = sum.toLocaleString('vi-VN') + " đ";
          checkoutBtn.disabled = false;
        }
      }

      function checkoutWalkin() {
        alert("In hoá đơn & Xuất vé thành công cho: " + walkinSeats.map(s => s.name).join(", "));
        window.location.reload();
      }

      // Map Enter Hotkey to checkout action
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          const btn = document.getElementById('checkout-btn');
          if (!btn.disabled) {
            checkoutWalkin();
          }
        }
      });
    </script>
  </body>
</html>
