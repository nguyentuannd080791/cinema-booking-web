<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineMax - Check-In Vé (Nhân viên)</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="role-simulator.js"></script>
    <style>
      body {
        background-color: var(--bg-primary);
      }
      .staff-action-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem;
      }
    </style>
  </head>
  <body>
    <!-- Staff Header Navbar -->
    <nav class="navbar-cinemax" style="border-bottom: 2px solid var(--warning) !important;">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <a class="nav-brand me-4" href="home.html">
            <i class="bi bi-shield-lock-fill text-warning"></i>CINE<span>MAX</span> <small class="text-warning-c fs-6 font-title ms-2">STAFF</small>
          </a>
          <span class="badge bg-warning text-dark font-title px-3 py-1 ms-2" style="font-size: 12px;">CHECK-IN MODE</span>
        </div>
        <div class="nav-actions">
          <a href="home.html" class="btn-nav-ghost"><i class="bi bi-box-arrow-left me-1"></i>Thoát</a>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <div class="row g-4">
        <!-- Main Seating Plan: 70% width on Desktop -->
        <div class="col-lg-8">
          <div class="card p-4 h-100 bg-transparent border-0">
            <h4 class="font-title mb-4 border-start border-warning border-4 ps-3 text-warning">Sơ Đồ Soát Vé Suất Chiếu</h4>
            
            <div class="screen-container text-center mb-5">
              <div class="screen-visual" style="background: rgba(255, 215, 0, 0.1);">MÀN HÌNH CHIẾU</div>
            </div>

            <!-- Seating matrix -->
            <div class="overflow-auto pb-3">
              <div class="seating-matrix" style="min-width: 600px;">
                <!-- Row A -->
                <div class="seat-row">
                  <span class="seat-label">A</span>
                  <button class="seat-btn disabled-staff" disabled>1</button>
                  <button class="seat-btn disabled-staff" disabled>2</button>
                  <button class="seat-btn checked-in" disabled><i class="bi bi-check-lg"></i></button>
                  <button class="seat-btn checked-in" disabled><i class="bi bi-check-lg"></i></button>
                  <span class="mx-3"></span>
                  <button class="seat-btn disabled-staff" disabled>5</button>
                  <button class="seat-btn needs-checkin" onclick="selectCheckinSeat(this, 'A6')">6</button>
                  <button class="seat-btn needs-checkin" onclick="selectCheckinSeat(this, 'A7')">7</button>
                  <button class="seat-btn disabled-staff" disabled>8</button>
                  <span class="seat-label">A</span>
                </div>

                <!-- Row B -->
                <div class="seat-row">
                  <span class="seat-label">B</span>
                  <button class="seat-btn needs-checkin" onclick="selectCheckinSeat(this, 'B1')">1</button>
                  <button class="seat-btn disabled-staff" disabled>2</button>
                  <button class="seat-btn disabled-staff" disabled>3</button>
                  <button class="seat-btn disabled-staff" disabled>4</button>
                  <span class="mx-3"></span>
                  <button class="seat-btn needs-checkin" onclick="selectCheckinSeat(this, 'B5')">5</button>
                  <button class="seat-btn checked-in" disabled><i class="bi bi-check-lg"></i></button>
                  <button class="seat-btn checked-in" disabled><i class="bi bi-check-lg"></i></button>
                  <button class="seat-btn disabled-staff" disabled>8</button>
                  <span class="seat-label">B</span>
                </div>

                <!-- Row C -->
                <div class="seat-row">
                  <span class="seat-label">C</span>
                  <button class="seat-btn disabled-staff" disabled>1</button>
                  <button class="seat-btn disabled-staff" disabled>2</button>
                  <button class="seat-btn needs-checkin" onclick="selectCheckinSeat(this, 'C3')">3</button>
                  <button class="seat-btn needs-checkin" onclick="selectCheckinSeat(this, 'C4')">4</button>
                  <span class="mx-3"></span>
                  <button class="seat-btn disabled-staff" disabled>5</button>
                  <button class="seat-btn disabled-staff" disabled>6</button>
                  <button class="seat-btn disabled-staff" disabled>7</button>
                  <button class="seat-btn disabled-staff" disabled>8</button>
                  <span class="seat-label">C</span>
                </div>

                <!-- Row D (Couple Seats) -->
                <div class="seat-row">
                  <span class="seat-label">D</span>
                  <button class="seat-btn couple needs-checkin" onclick="selectCheckinSeat(this, 'D1')">1</button>
                  <button class="seat-btn couple needs-checkin" onclick="selectCheckinSeat(this, 'D2')">2</button>
                  <span class="mx-3"></span>
                  <button class="seat-btn couple checked-in" disabled><i class="bi bi-check-lg"></i></button>
                  <button class="seat-btn couple disabled-staff" disabled>4</button>
                  <span class="seat-label">D</span>
                </div>
              </div>
            </div>

            <!-- Legend for Staff -->
            <div class="d-flex flex-wrap gap-4 mt-4 justify-content-center">
              <div class="d-flex align-items-center gap-2">
                <div class="seat-btn disabled-staff" style="width: 24px; height: 24px; opacity: 0.2;"></div>
                <span class="text-white-50">Ghế chưa bán (Không thao tác)</span>
              </div>
              <div class="d-flex align-items-center gap-2">
                <div class="seat-btn needs-checkin" style="width: 24px; height: 24px;"></div>
                <span class="text-white-50">Vé cần check-in</span>
              </div>
              <div class="d-flex align-items-center gap-2">
                <div class="seat-btn selected" style="width: 24px; height: 24px;"></div>
                <span class="text-white-50">Ghế chọn check-in</span>
              </div>
              <div class="d-flex align-items-center gap-2">
                <div class="seat-btn checked-in" style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;"><i class="bi bi-check-sm"></i></div>
                <span class="text-white-50">Đã check-in thành công</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Sidebar Actions: 30% width on Desktop -->
        <div class="col-lg-4">
          <div class="staff-action-card">
            <h4 class="font-title mb-4 border-start border-warning border-4 ps-3 text-warning">Xử Lý Check-In</h4>
            
            <div class="mb-3">
              <label class="text-white-50 d-block mb-1">Phim:</label>
              <h5 class="text-white font-title">Avatar: Dòng Chảy Của Nước</h5>
            </div>
            <div class="mb-3">
              <label class="text-white-50 d-block mb-1">Phòng & Suất chiếu:</label>
              <span class="text-white font-title d-block">Cinema Hall 1 - 19:00</span>
            </div>

            <hr class="border-secondary my-3" />

            <div class="mb-4">
              <label class="text-white-50 d-block mb-2">Các ghế chọn soát vé:</label>
              <div class="bg-dark p-3 rounded text-white font-title mb-0" id="selected-checkin-display" style="min-height: 50px;">
                Chưa chọn ghế nào
              </div>
            </div>

            <div class="d-grid gap-2">
              <button onclick="submitCheckin()" class="btn btn-warning btn-lg font-title py-3 text-dark fs-6" id="checkin-action-btn" disabled>
                <i class="bi bi-qr-code-scan me-2"></i>HOÀN TẤT CHECK-IN
              </button>
              <a href="movie-detail.html" class="btn btn-outline-secondary py-2 text-white-50">
                Thoát chế độ
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let selectedCheckinSeats = [];

      function selectCheckinSeat(btn, seatName) {
        btn.classList.toggle('selected');
        
        if (btn.classList.contains('selected')) {
          selectedCheckinSeats.push(seatName);
        } else {
          selectedCheckinSeats = selectedCheckinSeats.filter(name => name !== seatName);
        }

        const display = document.getElementById('selected-checkin-display');
        const actionBtn = document.getElementById('checkin-action-btn');

        if (selectedCheckinSeats.length === 0) {
          display.textContent = "Chưa chọn ghế nào";
          actionBtn.disabled = true;
        } else {
          display.textContent = selectedCheckinSeats.join(', ');
          actionBtn.disabled = false;
        }
      }

      function submitCheckin() {
        alert("Check-in thành công cho các ghế: " + selectedCheckinSeats.join(", "));
        window.location.reload();
      }
    </script>
  </body>
</html>
