<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineMax - Đăng Ký</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="role-simulator.js"></script>
    <style>
      body {
        background: linear-gradient(135deg, rgba(20, 20, 20, 0.95), rgba(43, 43, 43, 0.9)), 
                    url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }
      .register-container {
        min-height: calc(100vh - 64px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
      }
      .register-card {
        background-color: rgba(0, 0, 0, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px !important;
        max-width: 600px;
        width: 100%;
        padding: 3rem 2.5rem;
        box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      }
      /* Custom validation borders */
      .is-valid-custom {
        border-bottom-color: #2ECC71 !important;
      }
      .is-invalid-custom {
        border-bottom-color: #E50914 !important;
      }
      .form-check-input:checked {
        background-color: #E50914 !important;
        border-color: #E50914 !important;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar-cinemax">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="nav-brand" href="home.html">
          <i class="bi bi-film text-danger"></i>CINE<span>MAX</span>
        </a>
        <div class="nav-actions">
          <a href="home.html" class="btn-nav-ghost">Trang chủ</a>
        </div>
      </div>
    </nav>

    <div class="container register-container">
      <div class="register-card">
        <h2 class="font-title text-center mb-4">Đăng Ký Tài Khoản</h2>
        
        <form action="login.html" method="get">
          <div class="row">
            <!-- Hàng 1: Email (col-12) -->
            <div class="col-12 mb-3">
              <div class="form-floating">
                <input type="email" class="form-control auth-input bg-transparent is-valid-custom" id="floatingEmail" placeholder="name@example.com" value="user@example.com" required>
                <label for="floatingEmail" class="text-white-50">Địa chỉ Email</label>
                <div class="text-success mt-1" style="font-size: 0.85rem;"><i class="bi bi-check-circle me-1"></i>Email hợp lệ</div>
              </div>
            </div>

            <!-- Hàng 2: Họ tên (col-6), Số điện thoại (col-6) -->
            <div class="col-md-6 mb-3">
              <div class="form-floating">
                <input type="text" class="form-control auth-input bg-transparent" id="floatingName" placeholder="Full name" required>
                <label for="floatingName" class="text-white-50">Họ và tên</label>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="form-floating">
                <input type="tel" class="form-control auth-input bg-transparent" id="floatingPhone" placeholder="Phone" required>
                <label for="floatingPhone" class="text-white-50">Số điện thoại</label>
              </div>
            </div>

            <!-- Hàng 3: Mật khẩu (col-6), Xác nhận mật khẩu (col-6) -->
            <div class="col-md-6 mb-3">
              <div class="form-floating">
                <input type="password" class="form-control auth-input bg-transparent" id="floatingPassword" placeholder="Password" required>
                <label for="floatingPassword" class="text-white-50">Mật khẩu</label>
              </div>
            </div>
            <div class="col-md-6 mb-4">
              <div class="form-floating">
                <input type="password" class="form-control auth-input bg-transparent is-invalid-custom" id="floatingConfirmPassword" placeholder="Confirm Password" required>
                <label for="floatingConfirmPassword" class="text-white-50">Xác nhận mật khẩu</label>
                <div class="text-danger mt-1" style="font-size: 0.85rem;"><i class="bi bi-exclamation-circle me-1"></i>Mật khẩu xác nhận không khớp</div>
              </div>
            </div>
          </div>

          <!-- Checkbox Điều khoản -->
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" required checked>
            <label class="form-check-label text-muted-custom" for="flexCheckDefault">
              Tôi đồng ý với các điều khoản sử dụng và chính sách bảo mật của CineMax.
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 py-3 mb-3">Đăng Ký</button>
          
          <div class="text-center text-muted-custom mt-3">
            Bạn đã có tài khoản? <a href="login.html" class="text-danger text-decoration-none">Đăng nhập</a>
          </div>
        </form>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
