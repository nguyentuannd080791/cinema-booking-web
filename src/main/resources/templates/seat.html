<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <div class="container-fluid pt-lg-5 my-5" style="width: 80rem">
      <h3 class="text-center mb-4">Sơ Đồ Chọn Ghế</h3>

      <div class="d-flex justify-content-center gap-4 mb-4">
        <div class="d-flex align-items-center gap-2">
          <div
            class="btn btn-outline-secondary disabled"
            style="width: 24px; height: 24px; padding: 0"
          ></div>
          <span>Ghế trống</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div
            class="btn btn-success disabled"
            style="width: 24px; height: 24px; padding: 0"
          ></div>
          <span>Ghế đang chọn</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div
            class="btn btn-danger disabled"
            style="width: 24px; height: 24px; padding: 0"
          ></div>
          <span>Ghế đã khóa/Đã bán</span>
        </div>
      </div>

      <div class="text-center mb-3" th:if="${error}">
        <small class="text-danger fw-bold" th:text="${error}"></small>
      </div>

      <div
        class="seating-plan d-flex flex-column gap-2 align-items-center mb-4"
      >
        <div
          class="seat-row d-flex align-items-center gap-2"
          th:each="entry : ${seatMap}"
        >
          <span
            class="row-label fw-bold me-2"
            style="width: 4rem"
            th:text="'Hang ' + ${entry.key}"
          ></span>

          <button
            type="button"
            class="btn p-0 d-flex align-items-center justify-content-center"
            style="width: 40px; height: 40px; font-size: 14px"
            th:each="seat : ${entry.value}"
            th:classappend="${seat.ticketStatus != null and (seat.ticketStatus.name() == 'USED' or seat.ticketStatus.name()  == 'VALID')} ? 'btn btn-danger disabled' : 'btn-outline-secondary seat-item'"
            th:data-id="${seat.seatId}"
            th:data-number="${seat.seatNumber}"
            th:data-price="${seat.price}"
            th:text="${seat.seatNumber}"
            onclick="toggleSeat(this)"
          ></button>
        </div>
      </div>

      <form th:action="@{/showtime/{id}(id=${showtimeId})}" method="post">
        <input type="hidden" name="selectedSeatIds" id="selectedSeatIdsInput" />
        <div class="text-center">
          <button
            type="submit"
            class="btn btn-primary btn-lg px-5"
            onclick="getSelectedSeats()"
          >
            Xác nhận chọn ghế
          </button>
        </div>
      </form>
    </div>

    <script>
      function toggleSeat(seat) {
        if (seat.classList.contains("disabled")) return;

        if (seat.classList.contains("btn-outline-secondary")) {
          seat.classList.remove("btn-outline-secondary");
          seat.classList.add("btn-success", "selected");
        } else {
          seat.classList.remove("btn-success", "selected");
          seat.classList.add("btn-outline-secondary");
        }
      }

      function getSelectedSeats() {
        const selectedSeat = document.querySelectorAll(".seat-item.selected");
        const inputHidden = document.getElementById("selectedSeatIdsInput");
        const selectedIds = Array.from(selectedSeat).map((seat) =>
          seat.getAttribute("data-id"),
        );

        inputHidden.value = selectedIds.join(",");

        console.log("Các ID ghế đã chọn:", selectedIds);
      }
    </script>
  </body>
</html>
