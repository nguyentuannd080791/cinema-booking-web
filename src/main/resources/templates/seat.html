<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineMax - Sơ Đồ Chọn Ghế</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" th:href="@{/style.css}" />
    <style>
      .sticky-bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: rgba(20, 20, 20, 0.95);
        border-top: 1px solid #333;
        backdrop-filter: blur(10px);
        z-index: 1000;
        padding: 1.5rem 0;
      }
      body {
        padding-bottom: 140px; /* Space for sticky bar */
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar-cinemax">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <a class="nav-brand me-4" th:href="@{/home}">
            <i class="bi bi-film text-danger"></i>CINE<span>MAX</span>
          </a>
        </div>
        <span class="text-white-50 font-title fs-5">Sơ đồ chọn ghế</span>
      </div>
    </nav>

    <div class="container mt-5">
      <!-- Flash Messages -->
      <div th:if="${success}" class="alert alert-success alert-dismissible fade show bg-dark border-success text-success mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${success}">Thành công</span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show bg-dark border-danger text-danger mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}">Thông báo lỗi</span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <!-- Screen Area -->
      <div class="screen-container text-center mb-5">
        <div class="screen-3d"></div>
        <small class="text-white-50 font-title">MÀN HÌNH CHIẾU CHÍNH</small>
      </div>

      <!-- Scrollable Seat Plan Matrix -->
      <div class="overflow-auto pb-4">
        <div class="seating-matrix" style="min-width: 600px;">
          <!-- Seat rows from seatMap -->
          <div class="seat-row" th:each="entry : ${seatMap}">
            <span class="seat-label" th:text="${entry.key}">A</span>
            
            <th:block th:each="seat : ${entry.value}">
              <!-- Sold Seat -->
              <button th:if="${seat.ticketStatus != null}" 
                      class="seat-btn sold" 
                      th:text="${seat.seatNumber}">3</button>
                      
              <!-- Available Seat -->
              <button th:unless="${seat.ticketStatus != null}" 
                      class="seat-btn" 
                      th:classappend="${seat.seatType.name() == 'VIP'} ? 'border-warning text-warning' : (${seat.seatType.name() == 'COUPLE'} ? 'couple' : '')"
                      th:data-id="${seat.seatId}"
                      th:data-type="${seat.seatType.name()}"
                      th:data-price="${seat.price}"
                      onclick="toggleSeat(this)"
                      th:text="${seat.seatNumber.startsWith(entry.key) ? seat.seatNumber.substring(entry.key.length()) : seat.seatNumber}">1</button>
            </th:block>
            
            <span class="seat-label" th:text="${entry.key}">A</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Sticky Bottom Status & Action Bar -->
    <div class="sticky-bottom-bar">
      <div class="container">
        <div class="row align-items-center g-3">
          <!-- Legend -->
          <div class="col-md-6 d-flex flex-wrap justify-content-center justify-content-md-start gap-4">
            <div class="d-flex align-items-center gap-2">
              <div class="seat-btn" style="width: 24px; height: 24px;"></div>
              <span class="text-muted-custom">Ghế trống</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <div class="seat-btn border-warning text-warning" style="width: 24px; height: 24px;"></div>
              <span class="text-muted-custom">Ghế VIP</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <div class="seat-btn couple" style="width: 32px; height: 24px;"></div>
              <span class="text-muted-custom">Ghế Đôi</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <div class="seat-btn selected" style="width: 24px; height: 24px;"></div>
              <span class="text-muted-custom">Đang chọn</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <div class="seat-btn sold" style="width: 24px; height: 24px;"></div>
              <span class="text-muted-custom">Đã bán / Khóa</span>
            </div>
          </div>

          <!-- Checkout summary and confirm CTA -->
          <div class="col-md-6 d-flex align-items-center justify-content-center justify-content-md-end gap-4">
            <div class="text-end d-none d-sm-block">
              <span class="text-muted-custom d-block">Ghế đã chọn: <strong id="selected-seats-display" class="text-white">Chưa chọn</strong></span>
              <span class="text-muted-custom">Tổng tiền: <strong id="total-price-display" class="text-danger fs-5">0đ</strong></span>
            </div>
            
            <form th:action="@{/showtime/{id}(id=${showtimeId})}" method="post" id="seatForm">
              <input type="hidden" name="selectedSeatIds" id="selectedSeatIdsInput" />
              <button type="submit" class="btn btn-primary btn-lg px-4" id="confirm-btn">Xác nhận chọn ghế</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let selectedSeats = [];

      function toggleSeat(btn) {
        if (btn.classList.contains('sold')) return;

        btn.classList.toggle('selected');
        const seatId = btn.getAttribute('data-id');
        const seatName = btn.closest('.seat-row').querySelector('.seat-label').textContent + btn.textContent.trim();
        const price = parseFloat(btn.getAttribute('data-price'));

        if (btn.classList.contains('selected')) {
          selectedSeats.push({ id: seatId, name: seatName, price: price });
        } else {
          selectedSeats = selectedSeats.filter(seat => seat.id !== seatId);
        }

        updateDisplay();
      }

      function updateDisplay() {
        const display = document.getElementById('selected-seats-display');
        const priceDisplay = document.getElementById('total-price-display');
        const input = document.getElementById('selectedSeatIdsInput');
        const confirmBtn = document.getElementById('confirm-btn');

        if (selectedSeats.length === 0) {
          display.textContent = "Chưa chọn";
          priceDisplay.textContent = "0đ";
          input.value = "";
          confirmBtn.classList.add('disabled');
          confirmBtn.style.pointerEvents = 'none';
        } else {
          display.textContent = selectedSeats.map(s => s.name).join(', ');
          const total = selectedSeats.reduce((acc, curr) => acc + curr.price, 0);
          priceDisplay.textContent = total.toLocaleString('vi-VN') + "đ";
          input.value = selectedSeats.map(s => s.id).join(',');
          confirmBtn.classList.remove('disabled');
          confirmBtn.style.pointerEvents = 'auto';
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        updateDisplay();
      });
    </script>
  </body>
</html>
