<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineMax Admin - Quản lý Phim</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" th:href="@{/style.css}" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar-cinemax">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <a class="nav-brand me-4" th:href="@{/home}">
            <i class="bi bi-film text-danger"></i>CINE<span>MAX</span>
          </a>
          <span class="badge bg-warning text-dark font-title px-2 py-1 fs-6">ADMIN PORTAL</span>
        </div>
        <div class="nav-actions">
          <a th:href="@{/home}" class="btn-nav-ghost"><i class="bi bi-box-arrow-left me-1"></i>Thoát</a>
        </div>
      </div>
    </nav>

    <!-- Main Layout Grid -->
    <div class="container-fluid px-0">
      <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 admin-sidebar">
          <div class="py-4">
            <a th:href="@{/admin/dashboard}" class="sidebar-link">
              <i class="bi bi-speedometer2"></i> Tổng quan
            </a>
            <a th:href="@{/admin/movies}" class="sidebar-link active">
              <i class="bi bi-film"></i> Quản lý Phim
            </a>
            <a th:href="@{/admin/rooms}" class="sidebar-link">
              <i class="bi bi-door-open"></i> Quản lý Phòng
            </a>
            <a th:href="@{/admin/seats}" class="sidebar-link">
              <i class="bi bi-grid-3x3"></i> Quản lý Ghế
            </a>
          </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 p-4">
          <!-- Success/Error Alerts -->
          <div th:if="${success}" class="alert alert-success alert-dismissible fade show bg-dark border-success text-success mb-4" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}">Thành công</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show bg-dark border-danger text-danger mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}">Lỗi</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>

          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
            <h2 class="font-title mb-0 border-start border-danger border-4 ps-3 text-white">Danh Sách Phim</h2>
            <button class="btn btn-danger px-4" data-bs-toggle="modal" data-bs-target="#addMovieModal">
              <i class="bi bi-plus-lg me-1"></i> Thêm phim mới
            </button>
          </div>

          <!-- Movies Table -->
          <div class="admin-card py-2 text-white">
            <div class="table-responsive">
              <table class="table admin-table table-hover align-middle m-0">
                <thead>
                  <tr>
                    <th style="width: 80px;">Poster</th>
                    <th>Tên Phim</th>
                    <th>Thể Loại</th>
                    <th>Thời Lượng</th>
                    <th>Độ Tuổi</th>
                    <th>Trạng Thái</th>
                    <th class="text-end" style="width: 150px;">Thao Tác</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="movie : ${movies}">
                    <td>
                      <img th:src="${movie.posterURL}" class="rounded" style="width: 50px; height: 70px; object-fit: cover;" th:alt="${movie.title}" />
                    </td>
                    <td><strong class="text-white" th:text="${movie.title}">Avatar: Dòng Chảy Của Nước</strong></td>
                    <td th:text="${movie.categoryList != null && !movie.categoryList.isEmpty() ? #strings.listJoin(movie.categoryList.![categoryName], ', ') : 'Không có'}">Hành động, Khoa học viễn tưởng</td>
                    <td th:text="${movie.duration} + ' phút'">192 phút</td>
                    <td><span class="badge bg-danger" th:text="${movie.ageRating}">C13</span></td>
                    <td>
                      <span th:class="'badge ' + (${movie.status.name() == 'NOWSHOWING'} ? 'bg-success' : (${movie.status.name() == 'COMINGSOON'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                            th:text="${movie.status.name() == 'NOWSHOWING' ? 'Đang chiếu' : movie.status.name() == 'COMINGSOON' ? 'Sắp chiếu' : 'Hết chiếu'}">Đang chiếu</span>
                    </td>
                    <td class="text-end">
                      <button class="btn btn-outline-warning btn-sm me-1" data-bs-toggle="modal" th:data-bs-target="'#editMovieModal-' + ${movie.id}"><i class="bi bi-pencil-fill"></i></button>
                      <form th:action="@{/admin/movies/{id}/delete(id=${movie.id})}" method="post" style="display:inline;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa phim này không?');">
                        <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash-fill"></i></button>
                      </form>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Movie Modal -->
    <div class="modal fade" id="addMovieModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
          <div class="modal-header border-secondary">
            <h5 class="modal-title font-title"><i class="bi bi-plus-circle-fill me-2 text-danger"></i>Thêm Phim Mới</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form th:action="@{/admin/movies}" method="post">
            <div class="modal-body d-flex flex-column gap-3">
              <div>
                <label class="form-label text-white-50">Tên phim</label>
                <input type="text" class="form-control form-cine-dark text-white" name="title" required placeholder="Nhập tên phim..." />
              </div>
              <div class="row">
                <div class="col-6">
                  <label class="form-label text-white-50">Thời lượng (phút)</label>
                  <input type="number" class="form-control form-cine-dark text-white" name="duration" required placeholder="120" />
                </div>
                <div class="col-6">
                  <label class="form-label text-white-50">Độ tuổi</label>
                  <select class="form-select form-cine-dark text-white" name="ageRating">
                    <option value="P">P - Mọi lứa tuổi</option>
                    <option value="T13">T13 (C13)</option>
                    <option value="T16">T16 (C16)</option>
                    <option value="T18">T18 (C18)</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="form-label text-white-50">Ngôn ngữ</label>
                <input type="text" class="form-control form-cine-dark text-white" name="language" placeholder="Tiếng Việt, Phụ đề..." />
              </div>
              <div>
                <label class="form-label text-white-50">Ngày khởi chiếu</label>
                <input type="date" class="form-control form-cine-dark text-white" name="releaseDate" />
              </div>
              <div>
                <label class="form-label text-white-50">Mô tả phim</label>
                <textarea class="form-control form-cine-dark text-white" name="description" rows="3" placeholder="Mô tả phim..."></textarea>
              </div>
              <div>
                <label class="form-label text-white-50">Poster URL</label>
                <input type="url" class="form-control form-cine-dark text-white" name="posterURL" placeholder="https://..." />
              </div>
              <div>
                <label class="form-label text-white-50">Trạng thái</label>
                <select class="form-select form-cine-dark text-white" name="status">
                  <option value="NOWSHOWING">Đang chiếu</option>
                  <option value="COMINGSOON">Sắp chiếu</option>
                  <option value="NOLONGERSHOWING">Ngừng chiếu</option>
                </select>
              </div>
            </div>
            <div class="modal-footer border-secondary">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
              <button type="submit" class="btn btn-danger px-4 font-title text-white">Lưu Lại</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Edit Movie Modals -->
    <div th:each="movie : ${movies}" class="modal fade" th:id="'editMovieModal-' + ${movie.id}" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
          <div class="modal-header border-secondary">
            <h5 class="modal-title font-title"><i class="bi bi-pencil-square me-2 text-warning"></i>Sửa Thông Tin Phim</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form th:action="@{/admin/movies}" method="post">
            <input type="hidden" name="id" th:value="${movie.id}" />
            <div class="modal-body d-flex flex-column gap-3">
              <div>
                <label class="form-label text-white-50">Tên phim</label>
                <input type="text" class="form-control form-cine-dark text-white" name="title" th:value="${movie.title}" required />
              </div>
              <div class="row">
                <div class="col-6">
                  <label class="form-label text-white-50">Thời lượng (phút)</label>
                  <input type="number" class="form-control form-cine-dark text-white" name="duration" th:value="${movie.duration}" required />
                </div>
                <div class="col-6">
                  <label class="form-label text-white-50">Độ tuổi</label>
                  <select class="form-select form-cine-dark text-white" name="ageRating">
                    <option value="P" th:selected="${movie.ageRating == 'P'}">P - Mọi lứa tuổi</option>
                    <option value="T13" th:selected="${movie.ageRating == 'T13'}">T13 (C13)</option>
                    <option value="T16" th:selected="${movie.ageRating == 'T16'}">T16 (C16)</option>
                    <option value="T18" th:selected="${movie.ageRating == 'T18'}">T18 (C18)</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="form-label text-white-50">Ngôn ngữ</label>
                <input type="text" class="form-control form-cine-dark text-white" name="language" th:value="${movie.language}" />
              </div>
              <div>
                <label class="form-label text-white-50">Ngày khởi chiếu</label>
                <input type="date" class="form-control form-cine-dark text-white" name="releaseDate" th:value="${#temporals.format(movie.releaseDate, 'yyyy-MM-dd')}" />
              </div>
              <div>
                <label class="form-label text-white-50">Mô tả phim</label>
                <textarea class="form-control form-cine-dark text-white" name="description" rows="3" th:text="${movie.description}"></textarea>
              </div>
              <div>
                <label class="form-label text-white-50">Poster URL</label>
                <input type="url" class="form-control form-cine-dark text-white" name="posterURL" th:value="${movie.posterURL}" />
              </div>
              <div>
                <label class="form-label text-white-50">Trạng thái</label>
                <select class="form-select form-cine-dark text-white" name="status">
                  <option value="NOWSHOWING" th:selected="${movie.status.name() == 'NOWSHOWING'}">Đang chiếu</option>
                  <option value="COMINGSOON" th:selected="${movie.status.name() == 'COMINGSOON'}">Sắp chiếu</option>
                  <option value="NOLONGERSHOWING" th:selected="${movie.status.name() == 'NOLONGERSHOWING'}">Ngừng chiếu</option>
                </select>
              </div>
            </div>
            <div class="modal-footer border-secondary">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
              <button type="submit" class="btn btn-warning px-4 text-dark font-title">Cập Nhật</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
