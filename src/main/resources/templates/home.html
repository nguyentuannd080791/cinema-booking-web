<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <h1>Welcome home</h1>

    <div class="d-grid gap-2">
      <a th:href="@{/login}" class="btn btn-primary"> Login </a>
      <a th:href="@{/register}" class="btn btn-secondary"> Register </a>

      <div class="row">
        <div class="col-4" th:each="movie : ${movieList}">
          <a
            th:href="@{/movie/{id}(id=${movie.id})}"
            class="card"
            style="cursor: pointer; text-decoration: none"
          >
            <img
              class="card-img-top"
              th:src="${movie.posterURL}"
              th:alt="${movie.title}"
            />
            <div class="card-body">
              <h3 class="card-title" th:text="${movie.title}">Title</h3>
              <p class="card-text" th:text="${movie.duration}"></p>
              <p class="card-text" th:text="${movie.ageRating}"></p>
              <p class="badge bg-success" th:text="${movie.status}"></p>
            </div>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
