<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
  </head>
  <body class="bg-light">
    <div
      class="bg-white"
      style="
        width: 500px;
        margin: 50px auto;
        padding: 20px;
        border-radius: 10px;
      "
    >
      <h3 class="text-center mb-4">Welcome to cinemax</h3>
      <form th:action="@{/register}" method="post" th:object="${registerForm}">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            th:field="*{email}"
            id="email"
            aria-describedby="emailHelpId"
            placeholder="e.g. abc@mail.com"
          />
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
          ></span>
        </div>

        <div class="mb-3">
          <label for="fullname" class="form-label">Fullname</label>
          <input
            type="text"
            class="form-control"
            th:field="*{fullName}"
            id="fullname"
            aria-describedby="emailHelpId"
            placeholder="e.g. Nguyen Van A"
          />
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('fullName')}"
            th:errors="*{fullName}"
          ></span>
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label">Phone number</label>
          <input
            type="text"
            class="form-control"
            th:field="*{phone}"
            id="phone"
            aria-describedby="emailHelpId"
            placeholder="e.g. 0123456789"
          />
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('phone')}"
            th:errors="*{phone}"
          >
          </span>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            th:field="*{hashPassword}"
            id="password"
            placeholder=""
          />
          <span
            class="text-danger"
            th:if="${#fields.hasErrors('hashPassword')}"
            th:errors="*{hashPassword}"
          ></span>
        </div>

        <div class="mb-3">
          <label for="confirm-password" class="form-label"
            >Confirm Password</label
          >
          <input
            type="password"
            class="form-control"
            name="confirm-password"
            id="confirm-password"
            placeholder=""
          />
        </div>

        <div class="d-grid mb-3">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              name="checkbox"
              value="agree"
              id="agree"
            />
            <label class="form-check-label" for="agree">
              Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a> và
              <a href="#">Chính sách bảo mật</a>
            </label>
            <span class="text-danger" th:if="${#fields.hasGlobalErrors()}">
              <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </span>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
      </form>
    </div>
  </body>
</html>
